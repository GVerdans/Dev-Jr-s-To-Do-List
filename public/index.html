<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jr's Todo List v2.0</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>

  <!-- Nav -->
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <span class="navbar-text">
        Jr's Todo List v2.0
      </span>
  </nav>

  <div class="container">
    <div class="row justify-center my-5 py-5">

      <!-- Set Timer -->
      <div class="input-group mb-5">
        <button class="btn btn-outline-dark" type="button">Start</button>
        <select class="form-select" id="inputGroupSelect03" aria-label="Example select with button addon">
          <option selected>Choose Time...</option>
          <option value="1">30min</option>
          <option value="2">25min</option>
          <option value="3">20min</option>
        </select>
      </div>

      <div class="container text-center">
        <div class="row mb-5">
          <div class="col-12">
            <p class="h4 timer">00:00</p>

            <div class="row mt-3">
              <div class="col-12">
                <button class="btn btn-dark">Stop</button>
                <button class="btn btn-warning">Pause</button>
              </div>

            </div>
          </div>
        </div>
      </div>


      <hr class="mb-5">

      <!-- Task Input and Button -->
      <div class="col-8 offset-2">
        <div class="input-group">
          <input type="text" class="form-control inputTxtTask" placeholder="Insert a New Task !"
            aria-label="Insert a New Task !" aria-describedby="button-addon2">
          <button class="btn btn-outline-dark btnInsertTask" type="button" id="button-addon2">Insert</button>
        </div>
      </div>
    </div>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"></script>

    <script src="../dist/bundle.js"></script>
</body>

</html>
